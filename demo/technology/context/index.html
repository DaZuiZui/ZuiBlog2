<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f0e9">
    <title>文章阅读 — Bryan Yang</title>
    <link rel="stylesheet" href="../../../assets/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/styles/github-dark-dimmed.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.8.0/highlight.min.js"></script>
</head>
<body class="reader-page">
    <nav class="page-nav" aria-label="页面导航">
        <a class="brand" href="../../../index.html">
            <span class="brand-mark">
                <img src="https://avatars.githubusercontent.com/u/66861267?v=4" alt="" width="36" height="36">
            </span>
            <span>Bryan Yang</span>
        </a>
        <a class="back-link" href="../list/index.html" id="backBtn">← 返回文章列表</a>
    </nav>

    <main class="reader-main">
        <header class="reader-header">
            <span class="section-kicker">Writing / Bryan Yang</span>
            <div id="header-content">
                <h1>文章加载中…</h1>
            </div>
        </header>

        <article id="content" class="loading" aria-live="polite">
            <div class="spinner" aria-hidden="true"></div>
            <p>正在读取文章…</p>
        </article>

        <footer class="article-stats" id="stats" hidden>
            Estimated reading time / <span id="readTime">—</span> min
        </footer>
    </main>

    <img
        class="page-miku"
        src="../../../image/HatsuneMikuSekai.png"
        alt="初音未来"
        onclick="mikuClick(this)"
    >
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        marked.setOptions({ breaks: true, gfm: true });

        const DEFAULT_CONFIG = {
            repoOwner: 'DaZuiZui',
            repoName: 'ZuiBlog2',
            repoPath: 'blog/technology',
            listTitle: '技术文章',
            listEmoji: '📚',
            listDescription: '分享技术知识和开发经验',
            readerTitle: '文章阅读',
            welcomeMessage: '欢迎来到技术文章列表！'
        };

        const query = new URLSearchParams(window.location.search);
        const pageConfig = {
            ...DEFAULT_CONFIG,
            repoPath: query.get('repoPath') || DEFAULT_CONFIG.repoPath,
            listTitle: query.get('listTitle') || DEFAULT_CONFIG.listTitle,
            listEmoji: query.get('listEmoji') || DEFAULT_CONFIG.listEmoji,
            listDescription: query.get('listDescription') || DEFAULT_CONFIG.listDescription,
            readerTitle: query.get('readerTitle') || DEFAULT_CONFIG.readerTitle,
            welcomeMessage: query.get('welcomeMessage') || DEFAULT_CONFIG.welcomeMessage
        };

        function buildSearchParams(extraParams = {}) {
            return new URLSearchParams({
                repoPath: pageConfig.repoPath,
                listTitle: pageConfig.listTitle,
                listEmoji: pageConfig.listEmoji,
                listDescription: pageConfig.listDescription,
                readerTitle: pageConfig.readerTitle,
                welcomeMessage: pageConfig.welcomeMessage,
                ...extraParams
            });
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function buildRawContentUrl(filename) {
            const normalizedPath = pageConfig.repoPath
                .split('/')
                .map(segment => encodeURIComponent(segment))
                .join('/');
            return `https://raw.githubusercontent.com/${pageConfig.repoOwner}/${pageConfig.repoName}/main/${normalizedPath}/${encodeURIComponent(filename)}`;
        }

        function applyPageMeta() {
            document.title = `${pageConfig.readerTitle} — Bryan Yang`;
            const backButton = document.getElementById('backBtn');
            backButton.href = `../list/index.html?${buildSearchParams().toString()}`;
            backButton.textContent = `← 返回${pageConfig.listTitle}`;
        }

        function calculateReadTime(text) {
            const chineseCount = (text.match(/[\u4E00-\u9FA5]/g) || []).length;
            const englishCount = (text.match(/[a-zA-Z]+/g) || []).length;
            return Math.max(1, Math.ceil(chineseCount / 300 + englishCount / 200));
        }

        async function loadArticle() {
            const filename = query.get('file');
            const title = query.get('title');
            if (!filename) {
                showError('没有指定要阅读的文章');
                return;
            }

            try {
                const response = await fetch(buildRawContentUrl(filename), {
                    headers: { Accept: 'text/plain' }
                });
                if (!response.ok) throw new Error(`请求失败（${response.status}）`);

                const markdown = await response.text();
                const articleTitle = title || filename.replace(/\.md$/i, '');
                const safeHtml = DOMPurify.sanitize(marked.parse(markdown));

                document.title = `${articleTitle} — Bryan Yang`;
                document.getElementById('header-content').innerHTML = `
                    <h1>${escapeHtml(articleTitle)}</h1>
                    <div class="article-meta">
                        <span class="meta-item">${escapeHtml(filename)}</span>
                        <span class="meta-item">${markdown.length.toLocaleString()} chars</span>
                    </div>
                `;

                const content = document.getElementById('content');
                content.className = 'markdown-content';
                content.innerHTML = safeHtml;
                content.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));

                document.getElementById('readTime').textContent = calculateReadTime(markdown);
                document.getElementById('stats').hidden = false;
            } catch (error) {
                console.error('Error loading article:', error);
                showError(`文章加载失败：${error.message}`);
            }
        }

        function showError(message) {
            const content = document.getElementById('content');
            content.className = 'error-state';
            content.innerHTML = `
                <div class="error-icon">!</div>
                <p>${escapeHtml(message)}</p>
            `;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            window.clearTimeout(showToast.timer);
            showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2400);
        }

        function mikuClick(element) {
            const rect = element.getBoundingClientRect();
            ['♪', '♫', '♬'].forEach((symbol, index) => {
                window.setTimeout(() => {
                    const note = document.createElement('span');
                    note.className = 'music-note';
                    note.textContent = symbol;
                    note.style.left = `${rect.left + rect.width * 0.45}px`;
                    note.style.top = `${rect.top + 30}px`;
                    document.body.appendChild(note);
                    window.setTimeout(() => note.remove(), 1800);
                }, index * 120);
            });
            showToast('Miku says: 慢慢读，别忘了休息 ♪');
        }

        applyPageMeta();
        loadArticle();
    </script>
</body>
</html>
