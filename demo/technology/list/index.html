<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2f0e9">
    <title>技术文章 — Bryan Yang</title>
    <link rel="stylesheet" href="../../../assets/styles.css">
</head>
<body class="listing-page">
    <nav class="page-nav" aria-label="页面导航">
        <a class="brand" href="../../../index.html">
            <span class="brand-mark">BY</span>
            <span>Bryan Yang</span>
        </a>
        <a class="back-link" href="../../../index.html">← 返回首页</a>
    </nav>

    <main class="listing-main">
        <header class="listing-hero">
            <h1><span class="emoji" id="pageEmoji">📚</span><span id="pageTitle">技术文章</span></h1>
            <p id="pageDescription">分享技术知识、工程实践和开发过程中的真实经验。</p>
        </header>

        <div class="listing-toolbar">
            <div class="sort-controls" aria-label="文章排序">
                <button class="sort-btn active" type="button" data-sort="newest">最新优先</button>
                <button class="sort-btn" type="button" data-sort="oldest">最旧优先</button>
                <button class="sort-btn" type="button" data-sort="name">按名称</button>
            </div>
            <div class="stats" id="stats" hidden>
                Archive / <span class="stats-number" id="articleCount">0</span> entries
            </div>
        </div>

        <section id="articleList" class="dynamic-article-list" aria-live="polite">
            <div class="loading">
                <div class="spinner" aria-hidden="true"></div>
                <p>正在整理文章列表…</p>
            </div>
        </section>
    </main>

    <img
        class="page-miku"
        src="../../../image/HatsuneMikuSekai.png"
        alt="初音未来"
        onclick="mikuClick(this)"
    >
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        const DEFAULT_CONFIG = {
            repoOwner: 'DaZuiZui',
            repoName: 'ZuiBlog2',
            repoPath: 'blog/technology',
            listTitle: '技术文章',
            listEmoji: '📚',
            listDescription: '分享技术知识、工程实践和开发过程中的真实经验。',
            readerTitle: '文章阅读',
            welcomeMessage: '文章归档已打开'
        };

        const query = new URLSearchParams(window.location.search);
        const pageConfig = {
            ...DEFAULT_CONFIG,
            repoPath: query.get('repoPath') || DEFAULT_CONFIG.repoPath,
            listTitle: query.get('listTitle') || DEFAULT_CONFIG.listTitle,
            listEmoji: query.get('listEmoji') || DEFAULT_CONFIG.listEmoji,
            listDescription: query.get('listDescription') || DEFAULT_CONFIG.listDescription,
            readerTitle: query.get('readerTitle') || DEFAULT_CONFIG.readerTitle,
            welcomeMessage: query.get('welcomeMessage') || DEFAULT_CONFIG.welcomeMessage
        };

        let articles = [];
        let currentSort = 'newest';

        function buildSearchParams(extraParams = {}) {
            return new URLSearchParams({
                repoPath: pageConfig.repoPath,
                listTitle: pageConfig.listTitle,
                listEmoji: pageConfig.listEmoji,
                listDescription: pageConfig.listDescription,
                readerTitle: pageConfig.readerTitle,
                welcomeMessage: pageConfig.welcomeMessage,
                ...extraParams
            });
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function applyPageMeta() {
            document.title = `${pageConfig.listTitle} — Bryan Yang`;
            document.getElementById('pageEmoji').textContent = pageConfig.listEmoji;
            document.getElementById('pageTitle').textContent = pageConfig.listTitle;
            document.getElementById('pageDescription').textContent = pageConfig.listDescription;
        }

        async function fetchArticles() {
            try {
                const response = await fetch(
                    `https://api.github.com/repos/${pageConfig.repoOwner}/${pageConfig.repoName}/contents/${pageConfig.repoPath}`,
                    {
                        headers: {
                            Accept: 'application/vnd.github.v3+json',
                            'User-Agent': 'ZuiBlog-Reader'
                        }
                    }
                );

                if (!response.ok) {
                    if (response.status === 403) throw new Error('GitHub API 请求次数已达上限，请稍后重试');
                    if (response.status === 404) throw new Error(`内容目录不存在：${pageConfig.repoPath}`);
                    throw new Error(`请求失败（${response.status}）`);
                }

                const data = await response.json();
                articles = data
                    .filter(item => item.type === 'file' && /\.md$/i.test(item.name))
                    .map(item => ({
                        name: item.name,
                        title: item.name.replace(/\.md$/i, ''),
                        size: item.size,
                        date: new Date(0),
                        dateStr: '日期未知'
                    }));

                await Promise.all(articles.map(enrichWithDate));
                renderArticles();
                showStats();
            } catch (error) {
                console.error('Error fetching articles:', error);
                showError(`加载文章失败：${error.message}`);
            }
        }

        async function enrichWithDate(article) {
            try {
                const path = encodeURIComponent(`${pageConfig.repoPath}/${article.name}`);
                const response = await fetch(
                    `https://api.github.com/repos/${pageConfig.repoOwner}/${pageConfig.repoName}/commits?path=${path}&per_page=1`,
                    { headers: { 'User-Agent': 'ZuiBlog-Reader' } }
                );
                if (!response.ok) return;
                const commits = await response.json();
                if (commits.length > 0) {
                    article.date = new Date(commits[0].commit.author.date);
                    article.dateStr = formatDate(article.date);
                }
            } catch (error) {
                console.warn(`Unable to get date for ${article.name}`, error);
            }
        }

        function formatDate(date) {
            return new Intl.DateTimeFormat('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            }).format(date).replaceAll('/', '.');
        }

        function formatSize(bytes) {
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
        }

        function sortedArticles() {
            const sorted = [...articles];
            if (currentSort === 'newest') sorted.sort((a, b) => b.date - a.date);
            if (currentSort === 'oldest') sorted.sort((a, b) => a.date - b.date);
            if (currentSort === 'name') sorted.sort((a, b) => a.title.localeCompare(b.title, 'zh-CN'));
            return sorted;
        }

        function renderArticles() {
            const container = document.getElementById('articleList');
            const sorted = sortedArticles();
            if (sorted.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">∅</div>
                        <p>这里还没有文章，先去写下第一篇吧。</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = sorted.map((article, index) => {
                const encodedName = encodeURIComponent(article.name);
                const encodedTitle = encodeURIComponent(article.title);
                const isLatest = index === 0 && currentSort === 'newest';
                return `
                    <article class="article-item" tabindex="0" role="link" aria-label="阅读 ${escapeHtml(article.title)}"
                        onclick="openArticle(decodeURIComponent('${encodedName}'), decodeURIComponent('${encodedTitle}'))"
                        onkeydown="if(event.key === 'Enter') this.click()">
                        <span class="article-index">${String(index + 1).padStart(2, '0')}</span>
                        <div>
                            <h2 class="article-title">
                                ${escapeHtml(article.title)}
                                ${isLatest ? '<span class="article-badge">Latest</span>' : ''}
                            </h2>
                            <div class="article-meta">
                                <span>${escapeHtml(article.dateStr)}</span>
                                <span>${formatSize(article.size)}</span>
                                <span>Markdown</span>
                            </div>
                        </div>
                        <span class="article-open" aria-hidden="true">↗</span>
                    </article>
                `;
            }).join('');
        }

        function openArticle(filename, title) {
            const params = buildSearchParams({ file: filename, title });
            window.location.href = `../context/index.html?${params.toString()}`;
        }

        function showStats() {
            document.getElementById('articleCount').textContent = articles.length;
            document.getElementById('stats').hidden = false;
        }

        function showError(message) {
            document.getElementById('articleList').innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">!</div>
                    <p>${escapeHtml(message)}</p>
                </div>
            `;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            window.clearTimeout(showToast.timer);
            showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2400);
        }

        function mikuClick(element) {
            const rect = element.getBoundingClientRect();
            ['♪', '♫', '♬'].forEach((symbol, index) => {
                window.setTimeout(() => {
                    const note = document.createElement('span');
                    note.className = 'music-note';
                    note.textContent = symbol;
                    note.style.left = `${rect.left + rect.width * 0.45}px`;
                    note.style.top = `${rect.top + 30}px`;
                    document.body.appendChild(note);
                    window.setTimeout(() => note.remove(), 1800);
                }, index * 120);
            });
            showToast('选一篇感兴趣的，慢慢读 ♪');
        }

        document.querySelectorAll('.sort-btn').forEach(button => {
            button.addEventListener('click', event => {
                document.querySelectorAll('.sort-btn').forEach(item => item.classList.remove('active'));
                event.currentTarget.classList.add('active');
                currentSort = event.currentTarget.dataset.sort;
                renderArticles();
            });
        });

        applyPageMeta();
        fetchArticles();
    </script>
</body>
</html>
